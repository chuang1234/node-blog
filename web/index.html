<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="AI Agent 博客系统 - 集成大模型的内容创作、审核与互动平台" />
    <meta name="keywords" content="AI,博客,Agent,大模型,内容创作" />
    <title>AI Agent 博客系统</title>
    <style>
      /* 首屏加载动画，避免 JS 加载期间白屏 */
      #boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f7fa;
        z-index: 9999;
      }
      #boot-loading .ring {
        width: 42px;
        height: 42px;
        border: 3px solid #d6e4ff;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-loading .text {
        color: #8c8c8c;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loading">
        <div class="ring"></div>
        <div class="text">AI Agent 博客系统加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
