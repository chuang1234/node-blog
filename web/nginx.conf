server {
    listen 80;
    server_name _;

    # 上传文件体大小（封面/头像上传，默认 5MB，这里放宽到 10MB 留余量）
    client_max_body_size 10m;

    # SPA 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（React Router history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（转发到 server 服务 3000 端口）
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户上传的静态资源（头像 / 封面 / 正文图），由后端以 /uploads 提供
    location /uploads/ {
        proxy_pass http://server:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 接口文档（swagger-ui）
    location /api-docs {
        proxy_pass http://server:3000/api-docs;
        proxy_set_header Host $host;
    }
}
